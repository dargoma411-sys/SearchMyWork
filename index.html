<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SearchMyWork — биржа вакансий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="container header-inner">
    <h1 class="logo">Search<span>MyWork</span></h1>
    
    <nav class="nav">
      <button class="nav-btn active" data-page="jobs">Вакансии</button>
      <button class="nav-btn" data-page="post-job">Разместить вакансию</button>
      <button class="nav-btn" data-page="profiles">Специалисты</button>
      <button class="nav-btn" data-page="create-profile">О себе</button>
    </nav>
    
    <div class="controls">
      <select id="lang-select" class="lang-select">
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
      <button id="theme-toggle" class="theme-toggle">🌓</button>
    </div>
  </div>
</header>

<main class="main container">

  <!-- Страница поиска вакансий -->
  <section id="page-jobs" class="page active">
    <div class="filters-bar">
      <input type="text" id="search-input" placeholder="Поиск по названию..." class="filter-input">
      <select id="category-filter" class="filter-select">
        <option value="">Все категории</option>
        <option value="it">IT / Разработка</option>
        <option value="design">Дизайн</option>
        <option value="marketing">Маркетинг</option>
        <option value="sales">Продажи</option>
        <option value="finance">Финансы</option>
      </select>
      <input type="text" id="location-filter" placeholder="Локация" class="filter-input">
      <select id="employment-type" class="filter-select">
        <option value="">Тип занятости</option>
        <option value="fulltime">Полная занятость</option>
        <option value="parttime">Частичная</option>
        <option value="remote">Удалённо</option>
        <option value="contract">Контракт</option>
      </select>
      <input type="number" id="salary-min" placeholder="Зарплата от" class="filter-input small">
      <select id="sort-by" class="filter-select">
        <option value="newest">Сначала новые</option>
        <option value="salary-desc">Зарплата ↓</option>
        <option value="salary-asc">Зарплата ↑</option>
      </select>
    </div>
    
    <div id="jobs-list" class="cards-grid"></div>
  </section>

  <!-- Форма размещения вакансии -->
  <section id="page-post-job" class="page">
    <form id="job-form" class="form-card">
      <h2>Новая вакансия</h2>
      
      <label>Название должности *<input type="text" name="title" required></label>
      
      <label>Компания *<input type="text" name="company" required></label>
      
      <label>Категория *
        <select name="category" required>
          <option value="">Выберите...</option>
          <option value="it">IT / Разработка</option>
          <option value="design">Дизайн</option>
          <option value="marketing">Маркетинг</option>
          <option value="sales">Продажи</option>
          <option value="finance">Финансы</option>
        </select>
      </label>
      
      <label>Локация *<input type="text" name="location" required placeholder="Москва / Удалённо"></label>
      
      <label>Тип занятости *
        <select name="employment_type" required>
          <option value="">Выберите...</option>
          <option value="fulltime">Полная занятость</option>
          <option value="parttime">Частичная</option>
          <option value="remote">Удалённо</option>
          <option value="contract">Контракт</option>
        </select>
      </label>
      
      <div class="row">
        <label>Зарплата от<input type="number" name="salary_min" placeholder="50000"></label>
        <label>Зарплата до<input type="number" name="salary_max" placeholder="120000"></label>
      </div>
      
      <label>Описание *<textarea name="description" rows="6" required></textarea></label>
      
      <label>Требования<textarea name="requirements" rows="4"></textarea></label>
      
      <label>Условия работы<textarea name="benefits" rows="4"></textarea></label>
      
      <label>Email для связи *<input type="email" name="contact_email" required></label>
      
      <label>Телефон<input type="tel" name="contact_phone"></label>
      
      <button type="submit" class="btn-primary">Опубликовать вакансию</button>
    </form>
  </section>

  <!-- Список профилей специалистов -->
  <section id="page-profiles" class="page">
    <div class="profiles-header">
      <h2>Специалисты</h2>
      <input type="text" id="profile-search" placeholder="Поиск по имени или навыкам..." class="filter-input wide">
    </div>
    <div id="profiles-list" class="cards-grid"></div>
  </section>

  <!-- Создание профиля -->
  <section id="page-create-profile" class="page">
    <form id="profile-form" class="form-card">
      <h2>Расскажите о себе</h2>
      
      <label>Имя и фамилия *<input type="text" name="name" required></label>
      
      <label>Желаемая должность *<input type="text" name="desired_position" required></label>
      
      <label>Город *<input type="text" name="city" required></label>
      
      <label>Опыт работы (лет)<input type="number" name="experience_years" min="0"></label>
      
      <label>Ожидаемая зарплата<input type="number" name="expected_salary" placeholder="80000"></label>
      
      <label>Навыки (через запятую) *<input type="text" name="skills" required placeholder="JavaScript, React, Node.js"></label>
      
      <label>О себе *<textarea name="about" rows="6" required></textarea></label>
      
      <label>Portfolio / LinkedIn / GitHub<input type="url" name="portfolio_url"></label>
      
      <label>Email *<input type="email" name="email" required></label>
      
      <label>Телефон<input type="tel" name="phone"></label>
      
      <button type="submit" class="btn-primary">Создать профиль</button>
    </form>
  </section>

  <!-- Детали вакансии -->
  <section id="page-job-detail" class="page">
    <button id="back-to-jobs" class="btn-secondary">← Назад к списку</button>
    <div id="job-detail-content"></div>
  </section>

  <!-- Детали профиля -->
  <section id="page-profile-detail" class="page">
    <button id="back-to-profiles" class="btn-secondary">← Назад к специалистам</button>
    <div id="profile-detail-content"></div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
